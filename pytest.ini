[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi.routing
markers =
    x_core: frozen XODUZ model, identity, conversation, and gateway contracts
    permissions: immediate per-user capability grant enforcement
    admin_capabilities: registry-driven capability administration
    registry: authoritative capability metadata
    gateway: isolated authorization and execution boundary
    files: structured bounded local file operations
    adas: external ADAS SI evidence and managed records
    calibration_iq: Calibration IQ API and mutation receipts
    standalone: historical-project runtime dependency audit
    stt: speech-to-text behavior
    tts: text-to-speech behavior
    voice_settings: per-user audio setting behavior
    chat_core: model-first chat and persistence
    auth: OIDC and identity behavior
    authorization: sole-admin and capability authorization
    session: server-side session lifecycle
    memory_isolation: cross-user storage isolation
    context: context assembly and compaction
    model_runtime: model identity and health
    launcher: launcher configuration and lifecycle
    registry_gateway: capability registry and gateway
    ui_shell: permanent layout and smart scroll behavior
    user_identity: authenticated conversational naming
    voice: dictation lifecycle and error behavior
    voice_output: XODUZ text-to-speech settings and playback behavior
    project_context: optional user-scoped project context
    capability_registry: model-visible authoritative capabilities
    web: live current-information provider behavior
    databases: verified owner database adapters
    attachments: attachment UX and ownership
    artifacts: secure chat-native artifact display and continuity
    creator: Creator platform jobs, Builder, media, previews, and security boundaries
    security: cross-user isolation, secret-path denial, and capability schema enforcement
    engineering: read-only repository inspection surface for ordinary conversation
    assistant: ordinary conversation orchestrator budgets, synthesis, and terminal semantics
