name: XV12 capability contract

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  capability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XV12_AUTH_MODE: test
      XV12_OWNER_GOOGLE_SUB: ci-test-admin-sub
      XV12_COOKIE_SECURE: '0'
      XV12_GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
      XV12_GOOGLE_CLIENT_SECRET: ci-test-secret
      XV12_GOOGLE_REDIRECT_URI: http://127.0.0.1:8120/api/auth/google/callback
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run capability truth and inventory regressions
        run: python -m pytest -q tests/test_capability_truth_inventory.py
