name: XV12 capability contract

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  capability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XV12_AUTH_MODE: test
      XV12_OWNER_GOOGLE_SUB: ci-test-admin-sub
      XV12_COOKIE_SECURE: '0'
      XV12_GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
      XV12_GOOGLE_CLIENT_SECRET: ci-test-secret
      XV12_GOOGLE_REDIRECT_URI: http://127.0.0.1:8120/api/auth/google/callback
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run portable frozen-core and capability regressions
        run: >-
          python -m pytest -q -m "not databases"
          tests/test_capability_truth_inventory.py
          tests/test_permissions.py
          tests/test_artifacts.py
          tests/test_functional_assistant.py
          tests/test_chat_core.py
          tests/test_memory_context.py
          tests/test_model_compat.py
          tests/test_auth_session.py
          tests/test_capability_extensions.py
          tests/test_builder_execution_session.py
          tests/test_builder_active_job_dedupe.py
          tests/test_builder_artifact_handoff.py
          tests/test_onboarding.py
          tests/test_voice_output.py
